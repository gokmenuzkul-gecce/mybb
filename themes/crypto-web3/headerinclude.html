<script type="text/javascript">
var templates = { modal: '{$jsTemplates['modal']}', modal_button: '{$jsTemplates['modal_button']}' };
var cookieDomain = "{$mybb->settings['cookiedomain']}";
var cookiePath = "{$mybb->settings['cookiepath']}";
var cookiePrefix = "{$mybb->settings['cookieprefix']}";
var cookieSecureFlag = "{$mybb->settings['cookiesecureflag']}";
var deleteevent_confirm = "{$lang->deleteevent_confirm}";
var removeattach_confirm = "{$lang->removeattach_confirm}";
var loading_text = '{$lang->ajax_loading}';
var saving_changes = '{$lang->saving_changes}';
var use_xmlhttprequest = "{$mybb->settings['use_xmlhttprequest']}";
var my_post_key = "{$mybb->post_code}";
var rootpath = "{$mybb->settings['bburl']}";
var imagepath = "{$theme['imgdir']}";
var yes_confirm = "{$lang->yes}";
var no_confirm = "{$lang->no}";
var MyBBEditor = null;
var spinner_image = "{$theme['imgdir']}/spinner.gif";
var spinner = "<img src='" + spinner_image +"' alt='' />";
var modal_zindex = 9999;
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.querySelector('.nextgen-menu-toggle');
  var links = document.getElementById('nextgen-top-links');
  if (toggle && links) {
    toggle.addEventListener('click', function() {
      var open = links.classList.toggle('nextgen-menu-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  var searchTrigger = document.querySelector('.nextgen-search-trigger');
  var searchModal = document.getElementById('nextgen-search-modal');
  if (searchTrigger && searchModal) {
    var closeSearch = function() { searchModal.hidden = true; searchTrigger.setAttribute('aria-expanded', 'false'); };
    searchTrigger.addEventListener('click', function() { searchModal.hidden = false; searchTrigger.setAttribute('aria-expanded', 'true'); var input = searchModal.querySelector('input[name="keywords"]'); if (input) input.focus(); });
    searchModal.querySelectorAll('[data-search-close]').forEach(function(item) { item.addEventListener('click', closeSearch); });
    searchModal.querySelectorAll('[data-search-suggestion]').forEach(function(item) { item.addEventListener('click', function() { var input = searchModal.querySelector('input[name="keywords"]'); input.value = item.getAttribute('data-search-suggestion'); input.focus(); }); });
    document.addEventListener('keydown', function(event) { if (event.key === 'Escape') closeSearch(); });
  }
  document.querySelectorAll('.sceditor-container').forEach(function(editor) {
    if (!editor.querySelector('.nextgen-editor-suggestions')) {
      var suggestion = document.createElement('div');
      suggestion.className = 'nextgen-editor-suggestions';
      suggestion.innerHTML = '<strong>Yazım önerisi:</strong> Konunuza açıklayıcı bir başlık verin, içerikte bağlantıları ve önemli noktaları düzenli paylaşın.';
      editor.appendChild(suggestion);
    }
  });
  var usermenu = document.querySelector('[data-usermenu]');
  if (usermenu) {
    var profileBtn = usermenu.querySelector('[data-usermenu-toggle]');
    var panel = usermenu.querySelector('.nextgen-usermenu-links');
    var setMenu = function(open) {
      usermenu.setAttribute('data-open', open ? '1' : '0');
      if (profileBtn) profileBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    if (profileBtn && panel) {
      profileBtn.addEventListener('click', function(event) {
        event.preventDefault();
        setMenu(usermenu.getAttribute('data-open') !== '1');
      });
      document.addEventListener('click', function(event) {
        if (!usermenu.contains(event.target)) setMenu(false);
      });
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') setMenu(false);
      });
    }
  }

  // Pin the search trigger + account menu into the brand row's band once the
  // page scrolls, so they stop hovering over the threads with posts showing
  // through them. Heights are measured unpinned and cached; only `--topoffset`
  // can change while pinned (the ACP control bar), so no reflow loop.
  var header = document.getElementById('header');
  var logoRow = document.getElementById('logo');
  var panelRow = document.querySelector('#panel .upper');
  if (header && logoRow && panelRow) {
    var root = document.documentElement;
    var container = document.getElementById('container');
    var logoH = 0;
    var update = function() {
      // Absolute document top of the page box: 0 normally, non-zero if anything
      // (an admin notice callout, say) is rendered above it.
      var top = container
        ? Math.max(0, Math.round(container.getBoundingClientRect().top + window.pageYOffset))
        : 0;
      root.style.setProperty('--topoffset', top + 'px');
      root.classList.toggle('panel-pinned', window.pageYOffset > logoH);
    };
    var measure = function() {
      root.classList.remove('panel-pinned');
      root.style.setProperty('--panel-h', '0px');
      logoH = logoRow.offsetHeight;
      root.style.setProperty('--logo-h', logoH + 'px');
      root.style.setProperty('--panel-h', panelRow.offsetHeight + 'px');
      update();
    };
    measure();
    window.addEventListener('resize', measure);
    var ticking = false;
    window.addEventListener('scroll', function() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(function() { ticking = false; update(); });
    }, { passive: true });
  }

});
</script>
